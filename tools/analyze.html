<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Door Read</title>
<meta name="description" content="Drop a Head Count CSV and read the night in three charts: how full, how hard the door worked, how long people stayed.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Oswald:wght@500;600&display=swap">
<style>
/* Layout: one screen. A line of figures, then three charts that each answer a
   different question — how full, how hard the door worked, how long people
   stayed — then the integrity flags. Everything else folds away. */
:root{
  --bg:#F4F5F7; --panel:#FFFFFF; --sunk:#EFF1F5; --line:#DDE2EA; --grid:#E7EAF1;
  --ink:#141922; --ink2:#49546B; --ink3:#79849A;
  --in:#1F9D74; --out:#D97706; --accent:#3B5BDB;
  --flagbg:#FFF6E5; --flag:#92400E; --ok:#1F9D74;
  --display:'Oswald','Arial Narrow',system-ui,sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --radius:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1218; --panel:#161B23; --sunk:#11151C; --line:#273040; --grid:#222A36;
    --ink:#E9EDF4; --ink2:#A8B4C7; --ink3:#7A8699;
    --in:#46C79E; --out:#F0A345; --accent:#8AA4FF;
    --flagbg:#2A2109; --flag:#F0C04A; --ok:#46C79E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1218; --panel:#161B23; --sunk:#11151C; --line:#273040; --grid:#222A36;
  --ink:#E9EDF4; --ink2:#A8B4C7; --ink3:#7A8699;
  --in:#46C79E; --out:#F0A345; --accent:#8AA4FF;
  --flagbg:#2A2109; --flag:#F0C04A; --ok:#46C79E;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);padding:0 20px 48px}
.wrap{max-width:1020px;margin:0 auto}
h1,h2{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit}
[hidden]{display:none !important}

/* ---------- masthead ---------- */
.mast{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;
  padding:20px 0 14px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.brand h1{font:600 26px/1 var(--display);letter-spacing:.07em;text-transform:uppercase}
.brand p{color:var(--ink3);font-size:13px}
.load{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;
  padding:7px 14px;font-size:13.5px;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn:focus-visible,summary:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.drop{border:1.5px dashed var(--line);border-radius:999px;padding:6px 14px;color:var(--ink2);font-size:13px}
body.dragging .drop{border-color:var(--accent);color:var(--accent)}
.dropveil{position:fixed;inset:0;background:color-mix(in srgb,var(--accent) 12%,transparent);
  border:2px dashed var(--accent);z-index:50;display:grid;place-items:center;
  font:600 20px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}

/* ---------- headline ---------- */
.head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;
  border-top:1px solid var(--line);padding-top:14px}
.head h2{font:500 19px/1.15 var(--display);letter-spacing:.04em;text-transform:uppercase}
.head .src{color:var(--ink3);font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap}
.sample-chip{background:var(--flagbg);color:var(--flag);border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:500}

.strip{display:flex;flex-wrap:wrap;gap:0 2px;margin-top:12px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.fig{flex:1 1 150px;min-width:0;padding:11px 14px;border-right:1px solid var(--line)}
.fig:last-child{border-right:0}
.fig b{display:block;font:500 25px/1 var(--display);font-variant-numeric:tabular-nums}
.fig span{display:block;margin-top:5px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3)}
.fig i{display:block;font-style:normal;color:var(--ink2);font-size:12px;margin-top:3px}
.fig.in b{color:var(--in)}

.read{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;margin-top:14px}
.read p{max-width:70ch;color:var(--ink2);font-size:16.5px;line-height:1.62;letter-spacing:.004em;
  text-wrap:pretty}
.read b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;
  white-space:nowrap;letter-spacing:0}

/* ---------- controls ---------- */
.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:18px;color:var(--ink2);font-size:13px}
.controls label{display:flex;gap:7px;align-items:center}
select,input[type="number"]{font:inherit;font-size:13.5px;padding:5px 8px;border-radius:8px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink)}
input[type="number"]{width:88px}
.hint{color:var(--ink3)}

/* ---------- charts ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  margin-top:10px;padding:10px 8px 4px}
.panelhead{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between;
  padding:2px 8px 6px}
.figtitle{font-size:14px;font-weight:600}
.legend{display:flex;gap:13px;font-size:12.5px;color:var(--ink2);flex-wrap:wrap}
.legend span{display:flex;gap:6px;align-items:center}
.swatch{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.swatch.line{height:2px;border-radius:0}
.plot{position:relative}
.plot svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;
  padding:6px 9px;font:500 12px/1.4 var(--body);white-space:nowrap;z-index:4;
  box-shadow:0 6px 18px rgba(0,0,0,.22);transform:translate(-50%,-115%)}
.tip b{font-family:var(--mono);font-weight:500}
.axis{font:400 11px var(--mono);fill:var(--ink3)}
.mark{fill:var(--ink);font:500 11.5px var(--body)}
.band{font:600 10.5px var(--display);letter-spacing:.15em;text-transform:uppercase;fill:var(--ink)}
.gridline{stroke:var(--grid);stroke-width:1}
.zero{stroke:var(--ink3);stroke-width:1;opacity:.5}

/* ---------- checks ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:flex;gap:9px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:7px 14px 7px 11px;font-size:13px}
.chip.flag{background:var(--flagbg);border-color:color-mix(in srgb,var(--flag) 35%,var(--line));color:var(--flag)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:0 0 auto}
.chip.flag .dot{background:var(--flag)}
.chip em{font-style:normal;color:var(--ink3);font-size:12px}
.chip.flag em{color:inherit;opacity:.8}

/* ---------- folded detail ---------- */
details{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
summary{cursor:pointer;padding:11px 14px;font-size:13.5px;font-weight:500;color:var(--ink2)}
.scroll{overflow-x:auto;border-top:1px solid var(--line);max-height:390px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{font:500 10.5px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);
  text-align:right;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;
  position:sticky;top:0;background:var(--panel)}
th:first-child,td:first-child{text-align:left}
td{padding:7px 11px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap;
  font-family:var(--mono);font-size:12.5px}
tr:last-child td{border-bottom:0}
td.word{font-family:var(--body);font-size:13px}
.barcell{display:block;height:6px;border-radius:999px;background:var(--accent);opacity:.85;min-width:2px}
.din{color:var(--in)} .dout{color:var(--out)}

.foot{color:var(--ink3);font-size:12.5px;padding-top:18px;max-width:80ch}
.error{background:var(--flagbg);color:var(--flag);border:1px solid var(--flag);border-radius:var(--radius);
  padding:12px 14px;margin-top:14px;font-size:14px}

@media (max-width:620px){
  body{padding:0 16px 40px}
  .fig{flex:1 1 44%;border-right:0;border-bottom:1px solid var(--line)}
  .fig b{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="wrap">

<header class="mast">
  <div class="brand">
    <h1>Door Read</h1>
    <p>A Head Count CSV, read in the browser. Nothing is uploaded.</p>
  </div>
  <div class="load">
    <span class="drop" id="drop">Drop a CSV, or paste one</span>
    <button class="btn primary" id="pick" type="button">Choose file</button>
    <button class="btn" id="sample" type="button">Sample night</button>
    <input type="file" id="file" accept=".csv,text/csv,text/plain" hidden>
  </div>
</header>

<div class="error" id="error" hidden></div>

<main id="report" hidden>
  <section id="summary">
    <div class="head">
      <h2 id="headline">Event</h2>
      <div class="src" id="source"></div>
    </div>
    <div class="strip" id="strip"></div>
    <div class="read">
      <p id="narrative"></p>
      <button class="btn" id="copy" type="button">Copy</button>
    </div>
  </section>

  <section id="charts">
    <div class="controls">
      <label>Bucket
        <select id="bucket">
          <option value="300000">5 min</option>
          <option value="600000" selected>10 min</option>
          <option value="900000">15 min</option>
          <option value="1800000">30 min</option>
          <option value="3600000">1 hour</option>
        </select>
      </label>
      <label>Capacity <input type="number" id="capacity" min="0" step="5" value="115" placeholder="none"></label>
      <span class="hint" id="caphint"></span>
    </div>

    <div class="panel">
      <div class="panelhead">
        <span class="figtitle">How full, and the door that filled it</span>
        <span class="legend">
          <span><i class="swatch" style="background:var(--in)"></i>Inside / arrivals</span>
          <span><i class="swatch" style="background:var(--out)"></i>Exits</span>
          <span><i class="swatch line" style="background:var(--ink2)"></i>Net</span>
        </span>
      </div>
      <div class="plot" id="plotOcc"></div>
      <div class="plot" id="plotFlow"></div>
    </div>

  </section>

  <section id="trust">
    <div class="chips" id="checks"></div>
    <details>
      <summary>Hour by hour</summary>
      <div class="scroll" id="hours"></div>
    </details>
    <details>
      <summary id="logsummary">Every tap</summary>
      <div class="scroll" id="log"></div>
    </details>
    <p class="foot" id="foot"></p>
  </section>
</main>
</div>

<script>
'use strict';
/* Door Read — reads a Head Count CSV and works the night out in the page.
   Nothing is uploaded, nothing is stored. Times are shown as they were at the
   door: the CSV carries both epoch_ms and the local time it was recorded in,
   so the event's own UTC offset is recovered per row and used for every label,
   whatever zone the reader is in. */

const $ = id => document.getElementById(id);
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------------- CSV ---------------- */

function parseCsv(text) {
  text = text.replace(/^﻿/, '');
  const rows = []; let row = [], cell = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else quoted = false; }
      else cell += c;
    } else if (c === '"') quoted = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ''));
}

// "2026-09-12 9:05:03 PM" or "2026-09-12 21:05:03" -> ms as if that wall time were UTC
function wallMs(s) {
  const m = String(s).trim().match(/^(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?$/i);
  if (!m) return null;
  let h = +m[4];
  const mer = (m[7] || '').toUpperCase();
  if (mer === 'PM' && h < 12) h += 12;
  if (mer === 'AM' && h === 12) h = 0;
  return Date.UTC(+m[1], +m[2] - 1, +m[3], h, +m[5], +(m[6] || 0));
}

const DIR = v => { const s = String(v).trim().toUpperCase(); return s === 'IN' ? 1 : s === 'OUT' ? -1 : 0; };

/* Reads the app's export by column name, and anything else by sniffing:
   a column of epoch milliseconds or parseable timestamps, and a column that
   says IN/OUT or +1/-1. */
function readEvents(rows) {
  if (!rows.length) throw new Error('That file is empty.');
  const head = rows[0].map(h => h.trim().toLowerCase());
  const known = ['epoch_ms', 'iso_timestamp', 'direction', 'delta', 'local_time'].some(k => head.includes(k));
  const body = known ? rows.slice(1) : rows;
  const col = n => head.indexOf(n);

  let iEpoch = col('epoch_ms'), iIso = col('iso_timestamp'), iLocal = col('local_time'),
      iDir = col('direction'), iDelta = col('delta');

  if (!known) {                                   // sniff a header-less or renamed file
    const probe = body.slice(0, 40);
    const width = Math.max(...probe.map(r => r.length));
    for (let c = 0; c < width; c++) {
      const vals = probe.map(r => (r[c] || '').trim()).filter(Boolean);
      if (!vals.length) continue;
      if (iEpoch < 0 && vals.every(v => /^\d{12,14}$/.test(v))) iEpoch = c;
      else if (iIso < 0 && vals.every(v => !isNaN(Date.parse(v)) && /[-:]/.test(v))) iIso = c;
      if (iDir < 0 && vals.every(v => DIR(v) !== 0)) iDir = c;
      else if (iDelta < 0 && vals.every(v => v === '1' || v === '-1' || v === '+1')) iDelta = c;
    }
  }
  if (iEpoch < 0 && iIso < 0 && iLocal < 0) throw new Error('No timestamp column found. Head Count CSVs have epoch_ms and iso_timestamp.');
  if (iDir < 0 && iDelta < 0) throw new Error('No direction column found. Head Count CSVs have direction (IN/OUT) and delta (+1/-1).');

  const ev = [];
  let offMissing = 0;
  for (const r of body) {
    let t = null;
    if (iEpoch >= 0 && /^\d{12,14}$/.test((r[iEpoch] || '').trim())) t = +r[iEpoch];
    else if (iIso >= 0 && r[iIso]) { const p = Date.parse(r[iIso]); if (!isNaN(p)) t = p; }
    else if (iLocal >= 0 && r[iLocal]) { const w = wallMs(r[iLocal]); if (w != null) t = w; }
    if (t == null) continue;

    let d = 0;
    if (iDir >= 0) d = DIR(r[iDir]);
    if (!d && iDelta >= 0) d = +r[iDelta] > 0 ? 1 : +r[iDelta] < 0 ? -1 : 0;
    if (!d) continue;

    // The offset the door was keeping, recovered per row so a clock change mid-event survives.
    let off = null;
    if (iLocal >= 0 && r[iLocal]) { const w = wallMs(r[iLocal]); if (w != null) off = Math.round((w - t) / 60000); }
    if (off == null) offMissing++;
    ev.push({ t, d, off });
  }
  if (ev.length < 2) throw new Error('Found fewer than two taps in that file.');
  ev.sort((a, b) => a.t - b.t);

  const anyOff = ev.find(e => e.off != null);
  const deviceOff = -new Date().getTimezoneOffset();
  let last = anyOff ? anyOff.off : deviceOff;
  for (const e of ev) { if (e.off == null) e.off = last; else last = e.off; }
  return { ev, ownZone: !anyOff, partial: offMissing > 0 && !!anyOff };
}

/* ---------------- time ---------------- */

const p2 = n => String(n).padStart(2, '0');
let EV = [];                                       // current event, for offset lookup

function offAt(t) {                                 // offset in force at that moment
  if (!EV.length) return -new Date().getTimezoneOffset();
  let lo = 0, hi = EV.length - 1;
  if (t <= EV[0].t) return EV[0].off;
  if (t >= EV[hi].t) return EV[hi].off;
  while (lo < hi - 1) { const mid = (lo + hi) >> 1; if (EV[mid].t <= t) lo = mid; else hi = mid; }
  return EV[lo].off;
}
const parts = t => new Date(t + offAt(t) * 60000);  // read with getUTC* only
function hm(t, secs) {
  const d = parts(t), h = d.getUTCHours();
  return (h % 12 || 12) + ':' + p2(d.getUTCMinutes()) + (secs ? ':' + p2(d.getUTCSeconds()) : '') + (h < 12 ? ' AM' : ' PM');
}
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function dayOf(t) { const d = parts(t); return WD[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MO[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); }
function spanOf(a, b) { const x = hm(a), y = hm(b); return x.slice(-2) === y.slice(-2) ? x.slice(0, -3) + '–' + y : x + '–' + y; }
function durShort(ms) {
  const m = Math.round(ms / 60000);
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60), r = m % 60;
  return r ? h + 'h ' + r + 'm' : h + 'h';
}
const num = n => n.toLocaleString();

/* ---------------- analysis ---------------- */

function analyse(ev) {
  const t0 = ev[0].t, t1 = ev[ev.length - 1].t, span = Math.max(1, t1 - t0);
  const series = [{ t: t0, o: 0 }], ins = [], outs = [];
  let occ = 0, peak = 0, peakAt = t0, low = 0, lowAt = t0, area = 0, prev = t0, negMs = 0;

  for (const e of ev) {
    area += occ * (e.t - prev);
    if (occ < 0) negMs += e.t - prev;
    prev = e.t;
    occ += e.d;
    (e.d > 0 ? ins : outs).push(e.t);
    if (occ > peak) { peak = occ; peakAt = e.t; }
    if (occ < low) { low = occ; lowAt = e.t; }
    series.push({ t: e.t, o: occ });
  }

  // The night splits on 80% of peak: filling until it first gets there, held
  // while it stays, emptying once it drops away for good.
  const thr = peak * 0.8;
  let fullFrom = null, fullTo = null, fullMs = 0;
  for (let i = 1; i < series.length; i++) {
    if (series[i - 1].o >= thr && thr > 0) {
      fullMs += series[i].t - series[i - 1].t;
      if (fullFrom == null) fullFrom = series[i - 1].t;
      fullTo = series[i].t;
    }
  }
  let halfOut = null;
  for (let i = 0; i < series.length; i++) if (series[i].t >= peakAt && series[i].o <= peak / 2) { halfOut = series[i].t; break; }

  // one guest in, one guest out, oldest first: an average that is honest, an individual that is not
  const queue = [], stays = [];
  for (const e of ev) {
    if (e.d > 0) queue.push(e.t);
    else if (queue.length) stays.push(e.t - queue.shift());
  }
  stays.sort((a, b) => a - b);
  const pct = q => stays.length ? stays[Math.min(stays.length - 1, Math.floor(q * stays.length))] : 0;

  // the longest stretch with nobody through the door, for the log checks
  let gap = { ms: 0, at: t0 };
  for (let i = 1; i < ev.length; i++) if (ev[i].t - ev[i - 1].t > gap.ms) gap = { ms: ev[i].t - ev[i - 1].t, at: ev[i - 1].t };

  let doubles = 0;
  for (let i = 1; i < ev.length; i++) if (ev[i].d === ev[i - 1].d && ev[i].t - ev[i - 1].t < 300) doubles++;

  return {
    t0, t1, span, series, peak, peakAt, low, lowAt, negMs,
    tin: ins.length, avgStay: ins.length ? area / ins.length : 0,
    turnover: peak ? ins.length / peak : 0,
    medianIn: ins.length ? ins[Math.ceil(ins.length / 2) - 1] : null,
    fullFrom, fullTo, fullMs, halfOut,
    stays, p50: pct(0.5), p90: pct(0.9),
    gap, doubles,
  };
}

function buckets(ev, unit, t0, t1) {
  const n = Math.max(1, Math.ceil((t1 - t0) / unit)), out = [];
  for (let i = 0; i < n; i++) out.push({ t: t0 + i * unit, in: 0, out: 0 });
  for (const e of ev) {
    const b = out[Math.min(n - 1, Math.floor((e.t - t0) / unit))];
    if (e.d > 0) b.in++; else b.out++;
  }
  for (const b of out) b.net = b.in - b.out;
  return out;
}

function hourRows(ev) {
  const rows = new Map();
  let occ = 0;
  for (const e of ev) {
    const d = parts(e.t);
    const key = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), d.getUTCHours());
    let r = rows.get(key);
    if (!r) { r = { key, label: hm(e.t).replace(/:\d\d/, ':00'), in: 0, out: 0, peak: occ, end: occ }; rows.set(key, r); }
    occ += e.d;
    if (e.d > 0) r.in++; else r.out++;
    if (occ > r.peak) r.peak = occ;
    r.end = occ;
  }
  return [...rows.values()];
}

/* ---------------- chart plumbing ---------------- */

const PAD = { l: 42, r: 14, t: 14, b: 6 };
const STEPS = [1, 2, 2.5, 5, 10];
function niceStep(x) {
  const p = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1e-9))));
  let best = STEPS[0];
  for (const c of STEPS) if (Math.abs(Math.log((x / p) / c)) < Math.abs(Math.log((x / p) / best))) best = c;
  return Math.max(1, Math.round(best * p) || 1);
}
// clock ticks on round local times, so the axis reads like a clock, not a stopwatch
const TICKS = [300000, 600000, 900000, 1800000, 3600000, 7200000, 10800000, 21600000];
function timeTicks(t0, t1, max) {
  const unit = TICKS.find(u => (t1 - t0) / u <= max) || TICKS[TICKS.length - 1];
  const off = offAt(t0) * 60000;
  const out = [];
  for (let t = Math.ceil((t0 + off) / unit) * unit - off; t <= t1; t += unit) out.push(t);
  return out.length >= 2 ? out : [t0, t1];
}

function plot(host, h, draw) {
  const w = Math.max(300, host.clientWidth);
  const g = { w, h, pw: w - PAD.l - PAD.r, ph: h - PAD.t - PAD.b, parts: [], X: null, Y: null,
    push(s) { this.parts.push(s); } };
  draw(g);
  host.innerHTML = '<svg viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" role="img">' + g.parts.join('') + '</svg>';
  return g;
}
const text = (x, y, s, cls, anchor) => '<text x="' + x + '" y="' + y + '" class="' + cls + '"' + (anchor ? ' text-anchor="' + anchor + '"' : '') + '>' + esc(s) + '</text>';
const hline = (g, y, cls) => '<line x1="' + PAD.l + '" y1="' + y + '" x2="' + (PAD.l + g.pw) + '" y2="' + y + '" class="' + cls + '"/>';

function yAxis(g, min, max, fmt) {
  const step = niceStep((max - min) / 3);
  const top = Math.ceil(max / step) * step || step, bot = Math.min(0, Math.floor(min / step) * step);
  g.Y = v => PAD.t + g.ph - (v - bot) / ((top - bot) || 1) * g.ph;
  for (let v = bot; v <= top + 1e-9; v += step) {
    const y = Math.round(g.Y(v)) + 0.5;
    g.push(hline(g, y, v === 0 ? 'zero' : 'gridline'));
    g.push(text(PAD.l - 7, y + 4, fmt ? fmt(v) : num(v), 'axis', 'end'));
  }
  return { top, bot };
}
function xAxis(g, t0, t1, y) {
  for (const t of timeTicks(t0, t1, Math.max(2, Math.floor(g.pw / 84)))) {
    const x = g.X(t);
    g.push(text(x, y, hm(t), 'axis', x < PAD.l + 24 ? 'start' : x > PAD.l + g.pw - 24 ? 'end' : 'middle'));
  }
}

function hover(host, g, hit) {
  const tip = el('div', 'tip');
  tip.hidden = true;
  host.appendChild(tip);
  const svg = host.querySelector('svg');
  const cross = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  cross.setAttribute('class', 'zero');
  cross.setAttribute('y1', PAD.t);
  cross.setAttribute('y2', PAD.t + g.ph);
  cross.style.display = 'none';
  svg.appendChild(cross);

  const move = e => {
    const r = svg.getBoundingClientRect();
    const found = hit((e.clientX - r.left) * (g.w / r.width));
    if (!found) { tip.hidden = true; cross.style.display = 'none'; return; }
    tip.innerHTML = found.html;
    tip.hidden = false;
    tip.style.left = Math.max(66, Math.min(r.width - 66, found.x * (r.width / g.w))) + 'px';
    tip.style.top = (found.y != null ? found.y * (r.height / g.h) : 34) + 'px';
    cross.setAttribute('x1', found.x); cross.setAttribute('x2', found.x);
    cross.style.display = '';
  };
  host.addEventListener('pointermove', move);
  host.addEventListener('pointerleave', () => { tip.hidden = true; cross.style.display = 'none'; });
}

/* ---------------- the three charts ---------------- */

// How full. Phase bands carry what a separate phases panel used to say, in the
// place where the shape they describe is actually drawn.
function drawNight(host, a, cap) {
  const g = plot(host, 220, g => {
    g.X = t => PAD.l + (t - a.t0) / a.span * g.pw;
    yAxis(g, Math.min(0, a.low), Math.max(a.peak, cap || 0) * 1.1 || 1);

    const bands = [];
    if (a.fullFrom != null) {
      bands.push([a.t0, a.fullFrom, 'var(--in)', 'filling ' + durShort(a.fullFrom - a.t0)]);
      bands.push([a.fullFrom, a.fullTo, 'var(--accent)', 'near peak ' + durShort(a.fullMs)]);
      bands.push([a.fullTo, a.t1, 'var(--out)', 'emptying ' + durShort(a.t1 - a.fullTo)]);
    }
    for (const [from, to, colour, label] of bands) {
      const x = g.X(from), w = g.X(to) - x;
      if (w <= 0) continue;
      g.push('<rect x="' + x + '" y="' + PAD.t + '" width="' + w + '" height="' + g.ph + '" fill="' + colour + '" opacity="0.18"/>');
      g.push('<line x1="' + x + '" y1="' + PAD.t + '" x2="' + x + '" y2="' + (PAD.t + g.ph) +
        '" stroke="' + colour + '" stroke-width="1" opacity="0.45"/>');
      if (w > 108) g.push(text(x + w / 2, PAD.t + 12, label, 'band', 'middle'));
    }

    let d = 'M' + g.X(a.t0) + ' ' + g.Y(0), py = g.Y(0);
    for (const p of a.series) { const x = g.X(p.t), y = g.Y(p.o); d += 'L' + x + ' ' + py + 'L' + x + ' ' + y; py = y; }
    d += 'L' + g.X(a.t1) + ' ' + py;
    g.push('<path d="' + d + 'L' + g.X(a.t1) + ' ' + g.Y(0) + 'Z" fill="var(--in)" opacity="0.15"/>');
    g.push('<path d="' + d + '" fill="none" stroke="var(--in)" stroke-width="2" stroke-linejoin="round"/>');

    if (cap) {
      const y = Math.round(g.Y(cap)) + 0.5;
      g.push('<line x1="' + PAD.l + '" y1="' + y + '" x2="' + (PAD.l + g.pw) + '" y2="' + y +
        '" stroke="var(--out)" stroke-width="1.5" stroke-dasharray="5 4"/>');
      g.push(text(PAD.l + g.pw, y - 5, 'capacity ' + num(cap), 'axis', 'end'));
    }
    const px = g.X(a.peakAt), pyk = g.Y(a.peak), flip = px > PAD.l + g.pw - 92;
    g.push('<circle cx="' + px + '" cy="' + pyk + '" r="4" fill="var(--in)" stroke="var(--panel)" stroke-width="2"/>');
    g.push(text(px + (flip ? -8 : 8), pyk - 8, num(a.peak) + ' at ' + hm(a.peakAt), 'mark', flip ? 'end' : 'start'));
  });
  hover(host, g, x => {
    const t = a.t0 + (x - PAD.l) / g.pw * a.span;
    if (t < a.t0 || t > a.t1) return null;
    let lo = 0, hi = a.series.length - 1;
    while (lo < hi - 1) { const mid = (lo + hi) >> 1; if (a.series[mid].t <= t) lo = mid; else hi = mid; }
    const o = a.series[lo].o;
    return { x: g.X(t), y: g.Y(o), html: '<b>' + num(o) + '</b> inside · ' + hm(t) + (cap ? ' · ' + Math.round(o / cap * 100) + '% of capacity' : '') };
  });
}

// The door itself, on the same time axis directly below: arrivals up, exits
// down, and the net line that used to be a chart of its own.
function drawFlow(host, bs, a, unit) {
  const g = plot(host, 132, g => {
    g.X = t => PAD.l + (t - a.t0) / a.span * g.pw;
    const max = Math.max(1, ...bs.map(b => Math.max(b.in, b.out)));
    const mid = PAD.t + (g.ph - 18) / 2, half = (g.ph - 18) / 2 - 2;
    const bw = Math.max(1.5, g.pw / bs.length - 2);
    g.Y = v => mid - v / max * half;
    g.push(hline(g, Math.round(mid) + 0.5, 'zero'));
    g.push(text(PAD.l - 7, mid - half + 9, '+' + num(max), 'axis', 'end'));
    g.push(text(PAD.l - 7, mid + half, '−' + num(max), 'axis', 'end'));

    for (const b of bs) {
      const x = g.X(b.t);
      if (b.in) g.push('<rect x="' + x + '" y="' + g.Y(b.in) + '" width="' + bw + '" height="' + Math.max(1, mid - g.Y(b.in) - 1) + '" rx="2" fill="var(--in)"/>');
      if (b.out) g.push('<rect x="' + x + '" y="' + (mid + 2) + '" width="' + bw + '" height="' + Math.max(1, mid - g.Y(b.out) - 1) + '" rx="2" fill="var(--out)"/>');
    }
    const pts = bs.map(b => [g.X(b.t) + bw / 2, g.Y(b.net)]);
    g.push('<path d="M' + pts.map(p => p[0] + ' ' + p[1]).join('L') + '" fill="none" stroke="var(--ink2)" stroke-width="1.5" opacity="0.85"/>');
    xAxis(g, a.t0, a.t1, PAD.t + g.ph);
  });
  hover(host, g, x => {
    const b = bs[Math.floor((x - PAD.l) / g.pw * bs.length)];
    if (!b) return null;
    const rate = Math.round(b.net / (unit / 3600000));
    return { x: g.X(b.t), y: PAD.t + 14,
      html: hm(b.t) + '–' + hm(b.t + unit) + ' · <b>' + b.in + '</b> in · <b>' + b.out + '</b> out · net <b>' +
        (rate > 0 ? '+' : '') + rate + '</b>/hr' };
  });
}


/* ---------------- read ---------------- */

// Two or three sentences, and only what the charts cannot say at a glance.
// Every figure is bolded, so the sentence can be skimmed for its numbers and
// read properly only if you want the shape around them.
function narrate(a, cap) {
  const n = v => '<b>' + v + '</b>';
  const s = [];
  s.push('Doors ran ' + n(spanOf(a.t0, a.t1)) + ' and ' + n(num(a.tin)) + ' guests came through, fullest at ' +
    n(hm(a.peakAt)) + ' with ' + n(num(a.peak)) + ' inside' +
    (cap ? ', ' + n(Math.round(a.peak / cap * 100) + '%') + ' of the ' + num(cap) + ' you allow' : '') + '.');
  if (a.fullMs > 0) s.push('It held within a fifth of that peak for ' + n(durShort(a.fullMs)) + ', ' +
    n(Math.round(a.fullMs / a.span * 100) + '%') + ' of the night, then took ' + n(durShort(a.t1 - a.peakAt)) + ' to clear' +
    (a.halfOut ? ', half of it gone by ' + n(hm(a.halfOut)) : '') + '.');
  const turned = 'the room turned over ' + n(a.turnover.toFixed(1) + '×');
  if (a.stays.length) s.push('The average guest stayed about ' + n(durShort(a.p50)) + ', one in ten past ' +
    n(durShort(a.p90)) + ', and ' + turned + '.');
  else s.push('Across the night ' + turned + '.');
  return s.join(' ');
}

/* ---------------- render ---------------- */

let A = null, CAP = 115, NAME = '', SAMPLE = false, ZONE_NOTE = '', resizeT = null;

const fig = (v, label, note, cls) =>
  '<div class="fig' + (cls ? ' ' + cls : '') + '"><b>' + esc(v) + '</b><span>' + esc(label) + '</span>' +
  (note ? '<i>' + esc(note) + '</i>' : '') + '</div>';

function render() {
  $('report').hidden = false;          // before drawing: a hidden host measures 0 wide
  const a = A, unit = +$('bucket').value;
  const bs = buckets(EV, unit, a.t0, a.t1);

  $('headline').textContent = dayOf(a.t0) + ' · ' + spanOf(a.t0, a.t1);
  $('source').innerHTML = (SAMPLE ? '<span class="sample-chip">Sample night</span>' : '<span>' + esc(NAME) + '</span>') +
    '<span>' + num(EV.length) + ' taps</span><span>' + esc(ZONE_NOTE) + '</span>';

  $('strip').innerHTML = [
    fig(num(a.tin), 'guests in', 'half in by ' + hm(a.medianIn), 'in'),
    fig(num(a.peak), 'peak inside', 'at ' + hm(a.peakAt)),
    fig(durShort(a.avgStay), 'average stay', 'time inside ÷ arrivals'),
  ].join('');

  $('narrative').innerHTML = narrate(a, CAP);
  $('caphint').textContent = CAP
    ? (a.peak > CAP ? 'Peak went ' + num(a.peak - CAP) + ' over.' : num(CAP - a.peak) + ' spare at the fullest moment.')
    : 'Set a capacity to see headroom.';

  drawNight($('plotOcc'), a, CAP);
  drawFlow($('plotFlow'), bs, a, unit);

  const checks = [
    [a.doubles === 0, a.doubles ? a.doubles + ' taps under 0.3 s apart' : 'No double taps', a.doubles ? 'same direction' : ''],
    [a.low >= 0, a.low < 0 ? 'Count went ' + num(-a.low) + ' below zero' : 'Never below zero',
      a.low < 0 ? durShort(a.negMs) + ' negative, lowest ' + hm(a.lowAt) : ''],
    [a.gap.ms < 1800000, 'Quietest spell ' + durShort(a.gap.ms), 'from ' + hm(a.gap.at)],
  ];
  $('checks').innerHTML = checks.map(c => '<span class="chip' + (c[0] ? '' : ' flag') + '"><i class="dot"></i>' +
    esc(c[1]) + (c[2] ? ' <em>' + esc(c[2]) + '</em>' : '') + '</span>').join('');

  const hrs = hourRows(EV), maxIn = Math.max(1, ...hrs.map(h => h.in));
  $('hours').innerHTML = '<table><thead><tr><th>Hour</th><th>In</th><th>Out</th><th>Net</th><th>Peak</th><th>Inside at end</th><th>Share</th></tr></thead><tbody>' +
    hrs.map(h => '<tr><td class="word">' + esc(h.label) + '</td><td class="din">' + h.in + '</td><td class="dout">' + h.out +
      '</td><td>' + (h.in - h.out > 0 ? '+' : '') + (h.in - h.out) + '</td><td>' + h.peak + '</td><td>' + h.end +
      '</td><td><i class="barcell" style="width:' + Math.round(h.in / maxIn * 100) + '%"></i></td></tr>').join('') +
    '</tbody></table>';

  const CAPROWS = 1000, rows = EV.slice(-CAPROWS), from = EV.length - rows.length;
  let occ = 0; const occs = EV.map(e => (occ += e.d));
  $('logsummary').textContent = 'Every tap' + (EV.length > CAPROWS ? ' — last ' + num(CAPROWS) + ' of ' + num(EV.length) : ' (' + num(EV.length) + ')');
  $('log').innerHTML = '<table><thead><tr><th>#</th><th>Time</th><th>Elapsed</th><th>Direction</th><th>Inside</th></tr></thead><tbody>' +
    rows.map((e, i) => {
      const k = from + i;
      return '<tr><td>' + (k + 1) + '</td><td>' + esc(hm(e.t, true)) + '</td><td>' + esc(durShort(e.t - a.t0)) +
        '</td><td class="' + (e.d > 0 ? 'din' : 'dout') + '">' + (e.d > 0 ? 'IN' : 'OUT') + '</td><td>' + occs[k] + '</td></tr>';
    }).reverse().join('') + '</tbody></table>';

  $('foot').textContent = 'Stays are estimated by pairing each exit with the earliest guest still inside: right on average, ' +
    'wrong for any individual. The log counts bodies through a door — it never identifies anyone, cannot tell a re-entry ' +
    'from a new guest, and ends at the last tap rather than when the room actually closed.';

  watchWidth();
}

// Redraw when the charts' own column changes width, not just when the window
// does: a tab that lays out late, or a pane that is resized, must not be left
// with charts drawn for a width the page no longer has.
let ro = null, lastW = 0;
function watchWidth() {
  lastW = $('plotOcc').clientWidth;
  if (ro || !window.ResizeObserver) return;
  ro = new ResizeObserver(entries => {
    const w = Math.round(entries[0].contentRect.width);
    if (!A || !w || w === lastW) return;
    clearTimeout(resizeT);
    resizeT = setTimeout(render, 80);
  });
  ro.observe($('plotOcc'));
}

/* ---------------- loading ---------------- */

function load(text, name, sample) {
  try {
    const read = readEvents(parseCsv(text));
    EV = read.ev;
    ZONE_NOTE = read.ownZone ? 'times in this device’s zone' : 'times as recorded at the door';
    A = analyse(EV);
    NAME = name;
    SAMPLE = !!sample;
    $('error').hidden = true;
    render();
  } catch (err) {
    $('error').textContent = err.message || String(err);
    $('error').hidden = false;
  }
}

function readFile(f) {
  const r = new FileReader();
  r.onload = () => load(String(r.result), f.name, false);
  r.onerror = () => { $('error').textContent = 'Could not read that file.'; $('error').hidden = false; };
  r.readAsText(f);
}

/* A plausible Saturday, generated here so the page opens showing what it does.
   Labelled as a sample, and replaced the moment a real CSV lands. */
function sampleCsv() {
  const start = new Date();
  start.setHours(21, 0, 0, 0);
  start.setDate(start.getDate() - ((start.getDay() + 1) % 7 || 7));   // last Saturday
  const t0 = start.getTime(), off = -start.getTimezoneOffset();
  const rows = [];
  let rnd = 20260912;
  const rand = () => (rnd = (rnd * 1103515245 + 12345) % 2147483648) / 2147483648;
  for (let m = 0; m < 330; m++) {
    const f = m / 330;
    const arrivals = Math.round(9 * Math.max(0, Math.sin(Math.PI * Math.min(1, f * 1.45))) * (0.6 + rand() * 0.8));
    const exits = f > 0.42 ? Math.round(11 * Math.sin(Math.PI * (f - 0.42) / 0.58) * (0.6 + rand() * 0.8)) : 0;
    for (let k = 0; k < arrivals; k++) rows.push([t0 + m * 60000 + Math.floor(rand() * 55000), 1]);
    for (let k = 0; k < exits; k++) rows.push([t0 + m * 60000 + Math.floor(rand() * 55000), -1]);
  }
  rows.sort((a, b) => a[0] - b[0]);
  const out = ['seq,iso_timestamp,local_time,epoch_ms,elapsed_s,elapsed_hms,direction,delta,occupancy,cumulative_in,cumulative_out'];
  let occ = 0, ci = 0, co = 0;
  rows.forEach((r, i) => {
    if (r[1] < 0 && occ <= 0) return;
    occ += r[1]; r[1] > 0 ? ci++ : co++;
    const d = new Date(r[0] + off * 60000), h = d.getUTCHours();
    const local = d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()) + ' ' +
      (h % 12 || 12) + ':' + p2(d.getUTCMinutes()) + ':' + p2(d.getUTCSeconds()) + (h < 12 ? ' AM' : ' PM');
    out.push([i + 1, new Date(r[0]).toISOString(), local, r[0], ((r[0] - t0) / 1000).toFixed(3), '', r[1] > 0 ? 'IN' : 'OUT', r[1], occ, ci, co].join(','));
  });
  return out.join('\r\n');
}

/* ---------------- wiring ---------------- */

$('pick').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', e => { if (e.target.files[0]) readFile(e.target.files[0]); });
$('sample').addEventListener('click', () => load(sampleCsv(), 'Sample night', true));
$('bucket').addEventListener('change', render);
$('capacity').addEventListener('input', e => { CAP = Math.max(0, +e.target.value || 0); render(); });

let veil = null;
document.addEventListener('dragover', e => {
  e.preventDefault();
  if (!veil) { veil = el('div', 'dropveil', 'Drop the CSV'); document.body.appendChild(veil); }
});
document.addEventListener('dragleave', e => { if (e.relatedTarget === null && veil) { veil.remove(); veil = null; } });
document.addEventListener('drop', e => {
  e.preventDefault();
  if (veil) { veil.remove(); veil = null; }
  const f = e.dataTransfer.files[0];
  if (f) readFile(f);
});
document.addEventListener('paste', e => {
  const t = (e.clipboardData || window.clipboardData).getData('text');
  if (t && t.includes(',') && t.split('\n').length > 3) load(t, 'Pasted CSV', false);
});
$('copy').addEventListener('click', async () => {
  const text = $('headline').textContent + '\n' + $('narrative').textContent;
  try { await navigator.clipboard.writeText(text); $('copy').textContent = 'Copied'; }
  catch {
    const r = document.createRange();
    r.selectNodeContents($('narrative'));
    getSelection().removeAllRanges(); getSelection().addRange(r);
    $('copy').textContent = 'Selected';
  }
  setTimeout(() => { $('copy').textContent = 'Copy'; }, 2000);
});

window.addEventListener('resize', () => { if (!A) return; clearTimeout(resizeT); resizeT = setTimeout(render, 160); });

load(sampleCsv(), 'Sample night', true);
</script>
</body>
</html>
